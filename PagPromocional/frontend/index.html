<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Distribuido</title>
    <link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>¡Bingo Distribuido!</h1>
                </div>
                <nav class="main-nav">
                    <a href="#registro" class="nav-btn">📖 Registro</a>
                    <a href="#terminos" class="nav-btn">⚙️ Términos</a>
                    <a href="#video" class="nav-btn">🎬 Video</a>
                    <a href="#instalacion" class="nav-btn">🎮 Instalación</a>
                    <a href="#uso" class="nav-btn">📋 Uso</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section id="registro">
                <h2 class="section-title">Registro</h2>
                <div class="card">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="username">Nombre de Usuario:</label>
                            <input type="text" id="username" placeholder="Ingresa tu nombre de jugador" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" placeholder="Crea una contraseña segura" required>
                        </div>
                        <button type="submit" class="btn btn-red">Registrarse</button>
                    </form>
                    <div id="registerResult"></div>
                </div>
            </section>

            <section id="terminos">
                <h2 class="section-title">Términos y Condiciones</h2>
                <div class="card">
                    <button id="loadTerms" class="btn btn-yellow">Mostrar Términos y Condiciones</button>
                    <div id="termsContent"></div>
                </div>
            </section>

            <section id="video">
                <h2 class="section-title">Video del Juego</h2>
                <div class="card">
                    <button id="loadVideo" class="btn btn-red">Cargar Video Promocional</button>
                    <div id="videoContent">
                        <div class="video-placeholder" onclick="loadVideoContent()">
                            Haz clic para reproducir el video del juego
                        </div>
                    </div>
                </div>
            </section>

            <section id="instalacion">
                <h2 class="section-title">Instrucciones de Instalación</h2>
                <div class="card">
                    <button id="loadInstall" class="btn btn-yellow">Mostrar Instrucciones de Instalación</button>
                    <div id="installContent"></div>
                </div>
            </section>

            <section id="uso">
                <h2 class="section-title">Instrucciones de Uso</h2>
                <div class="card">
                    <button id="loadUsage" class="btn btn-red">Mostrar Instrucciones de Uso</button>
                    <div id="usageContent"></div>
                </div>
            </section>
        </div>
    </main>

 

    <script src="js/app.js"></script>
</body>
</html>
